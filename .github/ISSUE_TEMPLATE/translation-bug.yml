name: 翻译结果问题
description: 公司电脑发现翻译、格式、导出、补译、质量检查异常时使用这个模板。
title: "[Translation Bug]: "
labels:
  - translation-bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        请不要上传包含客户隐私、未脱敏公司资料或敏感医学数据的原始文件。优先上传脱敏截图、问题段落和复现信息。

  - type: textarea
    id: summary
    attributes:
      label: 问题现象
      description: 简短说明哪里不对，例如“俄语 DOCX 目录残留英文 List/Home”或“PDF 下载后文本错位”。
      placeholder: 发生了什么问题？
    validations:
      required: true

  - type: dropdown
    id: document-kind
    attributes:
      label: 文件类型
      options:
        - Excel / XLSX
        - Word / DOCX
        - PDF
        - String resource
        - Other
    validations:
      required: true

  - type: input
    id: target-language
    attributes:
      label: 目标语言
      placeholder: 例如 Russian / French / Spanish / English / Traditional Chinese (Taiwan)
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: 网站版本
      description: 页面左上角版本号或 URL 中的 v 参数。
      placeholder: 例如 v0.0.50
    validations:
      required: true

  - type: dropdown
    id: issue-type
    attributes:
      label: 初步问题类型
      options:
        - non-target-residual 源语言/第三方语言残留
        - terminology 术语错误或不一致
        - translation-memory 相同原文译文不一致
        - placeholder 占位符/标签/ID 被破坏
        - number-unit-format 数字/单位/符号格式异常
        - layout 格式/图片/表格/编号/坐标错位
        - style 语气或表达风格不稳定
        - accuracy 语义误译/漏译/扩写
        - auth-deploy 登录/权限/部署问题
        - unsure 不确定
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 写清楚从上传文件到看到问题的操作路径。
      placeholder: |
        1. 打开 https://translation-tool-917.pages.dev
        2. 上传 ...
        3. 选择目标语言 ...
        4. 点击 ...
        5. 看到 ...
    validations:
      required: true

  - type: textarea
    id: source-target
    attributes:
      label: 原文 / 当前译文 / 期望译文
      description: 如果能复制文字，请贴这里；如果只能截图，请在下面上传截图。
      placeholder: |
        原文：
        当前译文：
        期望译文：
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏
      description: 直接把截图拖到这里。请先遮挡客户名、患者信息、订单号、邮箱、手机号等敏感内容。
      placeholder: 将图片粘贴或拖入此处。
    validations:
      required: false

  - type: input
    id: model
    attributes:
      label: 使用模型 / 策略
      placeholder: 例如 Auto / Gemini Flash / DeepSeek / Qwen / Smart Fill / Full Translation
    validations:
      required: false

  - type: textarea
    id: quality-report
    attributes:
      label: Quality Report / 日志摘录
      description: 如果页面有质量报告或控制台日志，复制关键几行。
      placeholder: 粘贴 Quality Report、日志或错误提示。
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认截图或文字中不包含未脱敏的客户资料、患者信息、订单号、邮箱、手机号或其他敏感数据。
          required: true
        - label: 如果需要使用原始文件复现，我会只在受控私有位置提供，不上传到公开 Issue。
          required: false

  - type: checkboxes
    id: asset
    attributes:
      label: 建议沉淀方向
      description: 不确定可以不选，Codex 修复时会再判断。
      options:
        - label: 应加入回归测试
        - label: 应加入 QA 校验规则
        - label: 应加入术语库
        - label: 应加入翻译记忆
        - label: 应加入目标语言 profile
        - label: 应改进用户提示或修正入口
