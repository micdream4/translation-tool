
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POCT Document Translator</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script>
    // Apply the saved theme before the first paint so the page never flashes the other theme.
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem('poct.ui_theme') === 'dark' ? 'dark' : 'light';
    } catch (error) {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
  <style>
    select option {
      background-color: rgb(var(--c-surface));
      color: rgb(var(--c-ink));
    }
  </style>
</head>
<body>
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
