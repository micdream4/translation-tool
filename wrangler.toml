name = "translation-tool"
compatibility_date = "2026-02-26"
pages_build_output_dir = "dist"
compatibility_flags = ["nodejs_compat"]

[vars]
VITE_TRANSLATION_MODE = "proxy"
REQUIRE_CF_ACCESS_EMAIL = "true"
VITE_PROXY_ENGINES = "deepseek,cloudflare-ai"
TRANSLATION_ENGINE_ORDER = "deepseek,cloudflare-ai"
VITE_CLOUDFLARE_AI_MODELS = "google/gemini-3.6-flash,google/gemini-3-flash"
CLOUDFLARE_AI_MODELS = "google/gemini-3.6-flash,google/gemini-3-flash"
CLOUDFLARE_AI_PRIMARY_MODELS = "google/gemini-3.6-flash"
CLOUDFLARE_AI_FALLBACK_MODELS = "google/gemini-3-flash"
CLOUDFLARE_AI_GATEWAY_ID = "default"
CLOUDFLARE_AI_MAX_OUTPUT_TOKENS = "8192"
CLOUDFLARE_AI_REASONING_EFFORT = "low"
CLOUDFLARE_AI_REQUEST_TIMEOUT_MS = "120000"
CLOUDFLARE_REVIEW_TRANSLATION_MODELS = "cloudflare-ai:google/gemini-3-flash,deepseek:deepseek-v4-flash,deepseek:deepseek-v4-pro,cloudflare-ai:openai/gpt-5.4,cloudflare-ai:anthropic/claude-sonnet-4.6"
CLOUDFLARE_REVIEW_JUDGE_MODELS = "cloudflare-ai:openai/gpt-5.4,cloudflare-ai:anthropic/claude-sonnet-4.6,deepseek:deepseek-v4-pro"
DEEPSEEK_MODELS = "deepseek-flash"
# DeepSeek goes first in "auto"; 50 s leaves the 90 s request budget room to fall through to Gemini.
DEEPSEEK_REQUEST_TIMEOUT_MS = "50000"
DEEPSEEK_PRO_REQUEST_TIMEOUT_MS = "120000"
DEEPSEEK_MAX_OUTPUT_TOKENS = "16384"
DEEPSEEK_PRO_MAX_OUTPUT_TOKENS = "24576"
MODEL_REVIEW_TRANSLATION_CONCURRENCY = "2"
MODEL_REVIEW_JUDGE_CONCURRENCY = "1"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "QA_FEEDBACK"
id = "0e336bbd8bd7473f8d400885ae71e49c"
