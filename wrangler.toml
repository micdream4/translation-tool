name = "translation-tool"
compatibility_date = "2026-02-26"
pages_build_output_dir = "dist"
compatibility_flags = ["nodejs_compat"]

[vars]
VITE_TRANSLATION_MODE = "proxy"
REQUIRE_CF_ACCESS_EMAIL = "true"
VITE_PROXY_ENGINES = "cloudflare-ai,deepseek,openrouter"
VITE_OPENROUTER_MODELS = "google/gemini-3-flash-preview,google/gemini-3.1-pro-preview,qwen/qwen3.6-plus,deepseek/deepseek-v4-pro,openai/gpt-5.3-chat"
VITE_OPENROUTER_AUTO_MODELS = "qwen/qwen3.6-plus,deepseek/deepseek-v4-pro"
CLOUDFLARE_AI_MODELS = "google/gemini-3-flash"
CLOUDFLARE_AI_GATEWAY_ID = "default"
CLOUDFLARE_AI_MAX_OUTPUT_TOKENS = "8192"
DEEPSEEK_MODELS = "deepseek-v4-flash"
DEEPSEEK_REQUEST_TIMEOUT_MS = "30000"
OPENROUTER_MODELS = "qwen/qwen3.6-plus,deepseek/deepseek-v4-pro"

[ai]
binding = "AI"
